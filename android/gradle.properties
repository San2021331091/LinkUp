# JVM Memory Settings
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8

# Parallel execution
org.gradle.parallel=true

# Gradle cache
org.gradle.caching=true

# IMPORTANT:
# Disable configuration cache because Flutter plugins currently break with it
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin incremental compilation (IMPORTANT FIX)
kotlin.incremental=false

# Kapt optimizations
kapt.incremental.apt=true
kapt.use.worker.api=true

# Android optimizations
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Flutter migration flags (safe modern defaults)
android.builtInKotlin=true
android.newDsl=true